
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17102e">
  <meta name="description" content="AJIT NOVA - Search the world">
  <link rel="manifest" href="./manifest.json">
  <title>AJIT NOVA</title>

  <style>
    :root {:root {
  --bg: #030817;
  --panel: rgba(7, 25, 58, .88);
  --text: #f4f9ff;
  --muted: #a9c7e8;
  --accent: #00c8ff;
  --accent2: #126bff;
  --border: rgba(0, 174, 255, .42);
    }
      --bg: #100a20;
      --panel: rgba(34, 23, 60, .82);
      --text: #faf7ff;
      --muted: #c0b2dc;
      --accent: #c084fc;
      --accent2: #8b5cf6;
      --border: rgba(216, 180, 254, .25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image:radial-gradient(ellipse at 50% 0%, #073b83 0%, transparent 48%),
radial-gradient(ellipse at 100% 60%, #061d4a 0%, transparent 48%),
radial-gradient(ellipse at 0% 85%, #020b20 0%, transparent 45%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(8, 5, 19, .18);
      pointer-events: none;
      z-index: -1;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      max-width: 1000px;
      margin: auto;
      padding: 20px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span, h1 span { color: var(--accent); }

    .small-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 55px 18px 115px;
      text-align: center;
    }

    .orb {
      width: 76px;
      height: 76px;
      border-radius: 25px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      font-size: 35px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #d8b4fe, #7c3aed 60%, #4c1d95);
      box-shadow: 0 0 45px #a855f766;
      transform: rotate(-5deg);
    }

    h1 {
      font-size: clamp(36px, 8vw, 58px);
      margin: 0;
      letter-spacing: -2px;
    }

    .subtitle {
      color: var(--muted);
      margin: 15px 0 32px;
      font-size: 15px;
      line-height: 1.7;
    }

    .searchbox {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 15px 55px #0004, 0 0 25px #a855f71a;
      backdrop-filter: blur(18px);
    }

    .searchbox input {
      min-width: 0;
      width: 100%;
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 13px 9px;
      font-size: 16px;
    }

    .searchbox input::placeholder { color: var(--muted); }

    .icon-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 13px;
      min-width: 44px;
      min-height: 44px;
      padding: 8px;
      color: white;
      background: #38245c;
    }

    .icon-btn.listening {
      background: #b91c1c;
      border-color: #fca5a5;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 0 #f8717100; }
      to { box-shadow: 0 0 18px #f87171aa; }
    }

    .search-btn {
      flex-shrink: 0;
      border: none;
      border-radius: 13px;
      padding: 0 16px;
      min-height: 44px;
      color: white;
      background: linear-gradient(135deg, #c084fc, #7c3aed);
      font-weight: bold;
      box-shadow: 0 4px 18px #8b5cf644;
    }

    .section-title {
      margin: 35px 0 15px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .shortcut {
      text-decoration: none;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 18px 8px;
      backdrop-filter: blur(12px);
      transition: transform .2s, border-color .2s;
    }

    .shortcut:active { transform: scale(.97); }
    .shortcut:hover { border-color: var(--accent); }

    .emoji {
      display: block;
      font-size: 25px;
      margin-bottom: 9px;
    }

    .label { font-size: 13px; font-weight: bold; }

    .hint {
      margin-top: 26px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
    }

    .bottom-tools {
      position: fixed;
      left: 50%;
      bottom: 15px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      width: calc(100% - 24px);
      max-width: 500px;
      z-index: 10;
    }

    #photoInput { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      border-radius: 12px;
      background: #281b43;
      border: 1px solid var(--border);
      color: white;
      font-size: 13px;
      display: none;
      z-index: 20;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 18px 18px 95px;
    }

    body.light {
      --bg: #f5efff;
      --panel: rgba(255, 255, 255, .91);
      --text: #25143e;
      --muted: #6d5b87;
      --accent: #7c3aed;
      --accent2: #6d28d9;
      --border: rgba(109, 40, 217, .2);
      background-image:
        radial-gradient(ellipse at top, #e5d0ff, transparent 60%);
    }

    body.light .icon-btn { color: #fff; }
    body.light .orb { color: white; }

    @media (max-width: 420px) {
      main { padding-top: 42px; }
      .brand { font-size: 17px; }
      .small-btn { padding: 9px; font-size: 12px; }
      .searchbox { gap: 5px; padding: 6px; }
      .searchbox input { font-size: 14px; padding: 10px 5px; }
      .icon-btn { min-width: 39px; min-height: 42px; padding: 5px; }
      .search-btn { padding: 0 10px; font-size: 13px; }
      .shortcut { padding: 15px 5px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">AJIT <span>NOVA</span></div>
    <button class="small-btn" id="themeBtn" type="button">
      ☀️ Theme
    </button>
  </header>

  <main>
    <div class="orb">N</div>

    <h1>AJIT <span>NOVA</span></h1>
    <div class="subtitle">
      YOUR WORLD. YOUR SEARCH.<br>
      Explore something new.
    </div>

    <form class="searchbox" id="searchForm">
      <input
        id="searchInput"
        type="search"
        placeholder="Search anything..."
        aria-label="Search the web"
        autocomplete="off"
        required
      >
      <button class="icon-btn" id="micBtn" type="button"
        aria-label="Search by voice" title="Speak to search">🎙️</button>
      <button class="search-btn" type="submit">Search ↗</button>
    </form>

    <div class="section-title">EXPLORE THE WEB</div>

    <div class="shortcuts">
      <a class="shortcut" href="https://www.google.com/" target="_blank" rel="noopener">
        <span class="emoji">🌐</span><span class="label">Web</span>
      </a>
      <a class="shortcut" href="https://images.google.com/" target="_blank" rel="noopener">
        <span class="emoji">🖼️</span><span class="label">Images</span>
      </a>
      <a class="shortcut" href="https://news.google.com/" target="_blank" rel="noopener">
        <span class="emoji">📰</span><span class="label">News</span>
      </a>
      <a class="shortcut" href="https://maps.google.com/" target="_blank" rel="noopener">
        <span class="emoji">📍</span><span class="label">Maps</span>
      </a>
      <a class="shortcut" href="https://scholar.google.com/" target="_blank" rel="noopener">
        <span class="emoji">🎓</span><span class="label">Study</span>
      </a>
      <a class="shortcut" href="https://www.youtube.com/" target="_blank" rel="noopener">
        <span class="emoji">▶️</span><span class="label">Videos</span>
      </a>
    </div>

    <div class="hint">
      Search the web. Discover something new.<br>
      Made with ❤️ by AJIT
    </div>
  </main>

  <div class="bottom-tools">
    <button class="small-btn" id="backgroundBtn" type="button">
      🖼️ My Background
    </button>
    <button class="small-btn" id="resetBtn" type="button">
      ↩️ Reset
    </button>
  </div>

  <input id="photoInput" type="file" accept="image/*">
  <div class="toast" id="toast" role="status"></div>
  <footer>AJIT NOVA · Personal Web Search</footer>

  <script>
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const photoInput = document.getElementById("photoInput");
    const toast = document.getElementById("toast");
    const micBtn = document.getElementById("micBtn");

    function showToast(message) {
      toast.textContent = message;
      toast.style.display = "block";
      clearTimeout(window.novaToastTimer);
      window.novaToastTimer = setTimeout(() => {
        toast.style.display = "none";
      }, 3000);
    }

    // Google web search
    searchForm.addEventListener("submit", function(event) {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) {
        searchInput.focus();
        return;
      }
      window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(query),
        "_blank"
      );
    });

    // Voice search: browser support is required
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add("listening");
        micBtn.textContent = "🔴";
        showToast("Bolna shuru karo...");
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        searchInput.value = transcript;
        showToast("Awaaz likh di gayi. Search dabao.");
      };

      recognition.onerror = function(event) {
        if (event.error === "not-allowed") {
          showToast("Microphone permission browser settings me allow karo.");
        } else {
          showToast("Voice search nahi chala. Dobara try karo.");
        }
      };

      recognition.onend = function() {
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎙️";
      };

      micBtn.addEventListener("click", function() {
        if (isListening) {
          recognition.stop();
        } else {
          try {
            recognition.start();
          } catch (error) {
            showToast("Thodi der baad dobara try karo.");
          }
        }
      });
    } else {
      micBtn.addEventListener("click", function() {
        showToast("Is browser me voice search supported nahi hai. Chrome me try karo.");
      });
    }

    // Custom background
    document.getElementById("backgroundBtn").addEventListener("click", function() {
      photoInput.click();
    });

    function applyBackground(dataUrl) {
      document.body.style.backgroundImage =
        'linear-gradient(rgba(12,6,25,.48), rgba(12,6,25,.48)), url("' +
        dataUrl + '")';
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      document.body.style.backgroundAttachment = "fixed";
    }

    try {
      const savedBackground = localStorage.getItem("ajitNovaBg");
      if (savedBackground) applyBackground(savedBackground);

      if (localStorage.getItem("ajitNovaLight") === "yes") {
        document.body.classList.add("light");
      }
    } catch (error) {}

    photoInput.addEventListener("change", function() {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showToast("Please choose an image.");
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        showToast("Choose a photo under 2 MB.");
        photoInput.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function() {
        try {
          localStorage.setItem("ajitNovaBg", reader.result);
          applyBackground(reader.result);
          showToast("Background saved on this device!");
        } catch (error) {
          showToast("Could not save. Try a smaller photo.");
        }
      };
      reader.onerror = function() {
        showToast("Could not read this photo.");
      };
      reader.readAsDataURL(file);
    });

    // Reset theme and custom background
    document.getElementById("resetBtn").addEventListener("click", function() {
      try {
        localStorage.removeItem("ajitNovaBg");
        localStorage.removeItem("ajitNovaLight");
        document.body.style.backgroundImage = "";
        document.body.classList.remove("light");
        photoInput.value = "";
        showToast("Theme and background reset.");
      } catch (error) {
        showToast("Could not reset settings.");
      }
    });

    // Toggle light and purple-dark themes
    document.getElementById("themeBtn").addEventListener("click", function() {
      document.body.classList.toggle("light");

      try {
        localStorage.setItem(
          "ajitNovaLight",
          document.body.classList.contains("light") ? "yes" : "no"
        );
      } catch (error) {}

      showToast(
        document.body.classList.contains("light")
          ? "Light theme enabled."
          : "Galaxy Purple theme enabled."
      );
    });
  </script>
</body>
</html>
