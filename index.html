<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJIT NOVA FREE SEARCH</title>
    
    <!-- Google Fonts for modern typography -->
    <link href="https://googleapis.com" rel="stylesheet">

    <!-- CSS स्टाइल एक ही जगह पर -->
    <style>
        /* बेसिक रीसेट और सेटिंग्स */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* एनिमेटेड नियोन बैकग्राउंड */
        .background-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 12s infinite alternate ease-in-out;
        }

        .c1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
            top: -10%;
            left: 10%;
        }

        .c2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #b152ff 0%, #7c00ff 100%);
            bottom: -10%;
            right: 10%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.2); }
        }

        /* सर्च कंटेनर (कांच जैसा लुक) */
        .search-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* ब्रांड टाइटल स्टाइल */
        .brand-title {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .brand-title span {
            display: block;
            font-size: 1.2rem;
            font-weight: 300;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        .tagline {
            font-size: 0.9rem;
            color: #66747e;
            margin-top: 20px;
        }

        /* सर्च बॉक्स और बटन */
        .search-box {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 6px;
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 1rem;
        }

        .search-box input::placeholder {
            color: #aaa;
        }

        .search-box button {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            outline: none;
            color: #0b0c10;
            font-weight: 600;
            padding: 0 25px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body>

    <!-- बैकग्राउंड में घूमने वाली नियोन लाइट्स -->
    <div class="background-animation">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
    </div>

    <!-- मुख्य सर्च बॉक्स एरिया -->
    <div class="search-container">
        <h1 class="brand-title">AJIT NOVA <span>FREE SEARCH</span></h1>
        
        <!-- अपनी ज़रूरत के हिसाब से action बदल लें (जैसे Google API या खुद का बैकएंड) -->
        <form action="/search" method="GET">
            <div class="search-box">
                <input type="text" name="q" placeholder="Explore the universe of knowledge..." required autocomplete="off">
                <button type="submit">Search</button>
            </div>
        </form>
        
        <p class="tagline">Fast. Private. Powerful.</p>
    </div>

</body>
</html>
