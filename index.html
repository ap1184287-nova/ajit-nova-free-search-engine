<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b19">
  <meta name="description" content="AJIT NOVA - Explore Beyond">
  <title>AJIT NOVA — Explore Beyond</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon192.png" type="image/png">

  <style>
    :root {
      --bg: #070b19;
      --blue: #168cff;
      --cyan: #36d9ff;
      --text: #f5f8ff;
      --muted: #a7b7d4;
      --panel: rgba(16, 29, 57, 0.78);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 50% 20%, #102e5a 0%, transparent 48%),
        linear-gradient(145deg, #070b19, #080e20 60%, #10132d);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-small {
      font-size: 17px;
      font-weight: 850;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    .install-btn {
      display: none;
      padding: 9px 14px;
      border: 1px solid #36d9ff80;
      border-radius: 12px;
      color: white;
      background: #142849;
      font-weight: 700;
      cursor: pointer;
    }

    main {
      width: 100%;
      max-width: 700px;
      margin: auto 0;
      padding: 55px 0 70px;
      text-align: center;
    }

    .nova-logo {
      display: inline-block;
      margin: 0 0 10px;
      font-size: clamp(42px, 11vw, 76px);
      line-height: 1.2;
      font-weight: 950;
      letter-spacing: 3px;
      color: #f7fbff;
      text-shadow:
        0 0 8px #168cff,
        0 0 20px #168cff,
        0 0 42px #0878ff;
      animation: novaFloat 3s ease-in-out infinite;
      transform-origin: center;
      will-change: transform, filter;
    }

    @keyframes novaFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
        filter: drop-shadow(0 0 5px #168cff);
      }
      25% {
        transform: translateY(-9px) rotate(-2deg);
        filter: drop-shadow(0 0 14px #36d9ff);
      }
      50% {
        transform: translateY(0) rotate(0deg);
        filter: drop-shadow(0 0 8px #168cff);
      }
      75% {
        transform: translateY(-6px) rotate(2deg);
        filter: drop-shadow(0 0 17px #36d9ff);
      }
    }

    .tagline {
      margin: 4px 0 32px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .search-panel {
      padding: 9px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid #36d9ff75;
      border-radius: 22px;
      box-shadow: 0 0 25px #168cff20;
      backdrop-filter: blur(16px);
      transition: box-shadow .25s, border-color .25s;
    }

    .search-panel:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 30px #168cff55;
    }

    #query {
      flex: 1;
      min-width: 0;
      padding: 14px 8px;
      background: transparent;
      border: 0;
      outline: 0;
      color: white;
      font-size: 16px;
    }

    #query::placeholder {
      color: #a7b7d4;
    }

    .icon-btn {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border: 1px solid #36d9ff40;
      border-radius: 14px;
      background: #122746;
      color: var(--cyan);
      font-size: 20px;
      cursor: pointer;
    }

    .search-btn {
      flex-shrink: 0;
      min-height: 43px;
      padding: 0 17px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #168cff, #1457e8);
      color: white;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 15px #168cff50;
    }

    .search-btn:active,
    .icon-btn:active,
    .install-btn:active {
      transform: scale(.96);
    }

    .hint {
      margin: 16px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .feature {
      padding: 10px 14px;
      border: 1px solid #36d9ff25;
      border-radius: 14px;
      background: #10203b99;
      color: #d8eaff;
      font-size: 12px;
    }

    footer {
      padding: 18px 0 5px;
      color: #8194b7;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 430px) {
      body {
        padding: 16px;
      }

      .search-panel {
        gap: 5px;
        padding: 7px;
        border-radius: 18px;
      }

      #query {
        font-size: 14px;
        padding: 12px 4px;
      }

      .icon-btn {
        width: 36px;
        height: 40px;
        font-size: 18px;
      }

      .search-btn {
        padding: 0 11px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nova-logo {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand-small">AN / NOVA</div>
    <button class="install-btn" id="installBtn" type="button">
      Install App
    </button>
  </header>

  <main>
    <div class="nova-logo">AJIT NOVA</div>
    <p class="tagline">Explore Beyond</p>

    <form class="search-panel" id="searchForm">
      <input
        id="query"
        type="search"
        placeholder="AJIT NOVA पर कुछ भी खोजें…"
        aria-label="Search the web"
        autocomplete="off"
        required
      >

      <button
        class="icon-btn"
        type="button"
        id="micBtn"
        aria-label="Voice search"
        title="Voice Search"
      >🎙</button>

      <button class="search-btn" type="submit">खोजें ↗</button>
    </form>

    <p class="hint" id="hint">
      दुनिया की जानकारी खोजें — एक ही जगह
    </p>

    <div class="features">
      <div class="feature">✦ Global Web Search</div>
      <div class="feature">🎙 Voice Search</div>
      <div class="feature">⚡ Mobile Friendly</div>
    </div>
  </main>

  <footer>
    AJIT NOVA · Explore Beyond · Built with curiosity
  </footer>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const micBtn = document.getElementById("micBtn");
    const hint = document.getElementById("hint");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const query = input.value.trim();

      if (!query) {
        input.focus();
        return;
      }

      window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);
    });

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micBtn.addEventListener("click", function () {
        hint.textContent = "सुन रहा हूँ… बोलिए!";
        try {
          recognition.start();
        } catch (error) {
          hint.textContent = "माइक्रोफोन पहले से चालू है।";
        }
      });

      recognition.onresult = function (event) {
        input.value = event.results[0][0].transcript;
        hint.textContent = "आपकी आवाज़ दर्ज हो गई।";
        form.requestSubmit();
      };

      recognition.onerror = function () {
        hint.textContent =
          "माइक की अनुमति दें या टेक्स्ट टाइप करें।";
      };

      recognition.onend = function () {
        if (hint.textContent === "सुन रहा हूँ… बोलिए!") {
          hint.textContent = "दुनिया की जानकारी खोजें — एक ही जगह";
        }
      };
    } else {
      micBtn.addEventListener("click", function () {
        hint.textContent =
          "इस ब्राउज़र में Voice Search उपलब्ध नहीं है।";
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async function () {
      if (!deferredPrompt) {
        hint.textContent =
          "ब्राउज़र मेन्यू से Add to Home screen चुनें।";
        return;
      }

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    window.addEventListener("appinstalled", function () {
      installBtn.style.display = "none";
      hint.textContent = "AJIT NOVA इंस्टॉल हो गया!";
    });

    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(function () {
            console.log("Service worker registration unavailable.");
          });
      });
    }
  </script>
</body>
</html>
