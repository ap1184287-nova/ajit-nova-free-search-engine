<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080e1e">
  <meta name="description" content="AJIT NOVA - Explore the world">
  <link rel="manifest" href="./manifest.json">
  <title>AJIT NOVA — Global Search</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080e1e;
      --panel: #101a30;
      --blue: #4285ff;
      --text: #f3f7ff;
      --muted: #a6b6d0;
      --border: #253653;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, #183567 0%, transparent 48%),
        var(--bg);
    }

    .wrap {
      width: min(850px, 100%);
      margin: auto;
      padding: 24px 17px 50px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 65px;
    }

    .brand {
      font-size: 23px;
      font-weight: 850;
      letter-spacing: 1px;
    }

    .brand span { color: #66a5ff; }

    .tag {
      color: #a6caff;
      font-size: 11px;
      border: 1px solid #34517c;
      padding: 7px 10px;
      border-radius: 30px;
    }

    .hero { text-align: center; }

    .globe {
      font-size: 40px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 54px);
      letter-spacing: -1.5px;
    }

    h1 span { color: #69a7ff; }

    .subtitle {
      color: var(--muted);
      margin: 12px 0 27px;
      font-size: 14px;
    }

    .search {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px;
      background: #111d34;
      border: 1px solid #35517c;
      border-radius: 17px;
      box-shadow: 0 12px 45px #0005;
    }

    .search:focus-within {
      border-color: #69a7ff;
    }

    #query {
      flex: 1;
      min-width: 0;
      padding: 12px 6px;
      background: transparent;
      border: 0;
      outline: 0;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
      font: inherit;
    }

    .mic, .go {
      flex-shrink: 0;
      border-radius: 12px;
      padding: 12px;
    }

    .mic { background: #243653; }
    .go { background: var(--blue); font-weight: 700; }

    button:focus-visible, a:focus-visible {
      outline: 2px solid #8fc1ff;
      outline-offset: 3px;
    }

    .sources {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 35px;
    }

    .pill {
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 7px 12px;
      font-size: 12px;
      color: #bcd3f5;
      background: #101a2c;
    }

    #status {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin: 20px 0;
    }

    #results { margin-top: 28px; }

    .result {
      padding: 17px;
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #101a2cdd;
    }

    .result a {
      color: #79b0ff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 650;
    }

    .result a:hover { text-decoration: underline; }

    .url {
      display: block;
      color: #82c6a5;
      font-size: 12px;
      margin: 7px 0;
      overflow-wrap: anywhere;
    }

    .snippet {
      color: #c0cbe0;
      font-size: 14px;
      line-height: 1.65;
      margin: 0;
    }

    .note {
      margin-top: 35px;
      text-align: center;
      color: #8191ab;
      font-size: 12px;
      line-height: 1.7;
    }

    footer {
      text-align: center;
      color: #7385a2;
      font-size: 12px;
      margin-top: 45px;
    }

    @media (max-width: 430px) {
      header { margin-bottom: 52px; }
      .brand { font-size: 20px; }
      .tag { font-size: 10px; }
      .search { gap: 5px; }
      .mic, .go { padding: 11px 10px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <div class="brand">✦ AJIT <span>NOVA</span></div>
      <div class="tag">GLOBAL SEARCH</div>
    </header>

    <section class="hero">
      <div class="globe">🌐</div>
      <h1>Explore <span>Beyond.</span></h1>
      <p class="subtitle">
        दुनिया को खोजो, एक ही जगह।
      </p>

      <form class="search" id="searchForm">
        <input
          id="query"
          type="search"
          placeholder="यहाँ कुछ भी खोजें..."
          aria-label="खोजने के लिए शब्द लिखें"
          autocomplete="off"
          required
        >
        <button class="mic" id="mic" type="button"
          aria-label="माइक्रोफोन से खोजें">🎙️</button>
        <button class="go" type="submit">खोजें</button>
      </form>

      <div class="sources">
        <span class="pill">🌍 ज्ञान खोज</span>
        <span class="pill">⚡ तेज़ खोज</span>
        <span class="pill">📱 मोबाइल + PC</span>
      </div>
    </section>

    <p id="status" role="status" aria-live="polite">
      AJIT NOVA में अपनी पहली खोज करें।
    </p>

    <section id="results" aria-label="खोज के नतीजे"></section>

    <p class="note">
      अभी खोज के नतीजे Wikipedia से प्राप्त होते हैं।
      यह शुरुआती संस्करण है; पूरे इंटरनेट का स्वतंत्र इंडेक्स नहीं।
    </p>

    <footer>
      AJIT NOVA · Your Search, Your Journey
    </footer>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const mic = document.getElementById("mic");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const term = input.value.trim();
      if (!term) {
        input.focus();
        return;
      }

      status.textContent = "खोज जारी है...";
      results.replaceChildren();

      try {
        const params = new URLSearchParams({
          action: "query",
          list: "search",
          srsearch: term,
          format: "json",
          origin: "*",
          srlimit: "10"
        });

        const response = await fetch(
          "https://hi.wikipedia.org/w/api.php?" + params
        );

        if (!response.ok) {
          throw new Error("Search service unavailable");
        }

        const data = await response.json();
        const items = data.query?.search || [];

        if (items.length === 0) {
          status.textContent =
            "कोई नतीजा नहीं मिला। दूसरे शब्दों से खोजें।";
          return;
        }

        status.textContent =
          `${items.length} नतीजे मिले — "${term}"`;

        items.forEach((item) => {
          const card = document.createElement("article");
          card.className = "result";

          const link = document.createElement("a");
          link.href =
            "https://hi.wikipedia.org/wiki/" +
            encodeURIComponent(item.title.replace(/ /g, "_"));
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = item.title;

          const url = document.createElement("span");
          url.className = "url";
          url.textContent = "hi.wikipedia.org";

          const snippet = document.createElement("p");
          snippet.className = "snippet";
          snippet.textContent = item.snippet
            .replace(/<[^>]*>/g, "")
            .replace(/&quot;/g, '"')
            .replace(/&#039;/g, "'")
            .replace(/&amp;/g, "&")
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">");

          card.append(link, url, snippet);
          results.append(card);
        });
      } catch (error) {
        status.textContent =
          "अभी नतीजे नहीं मिल पाए। इंटरनेट कनेक्शन जाँचकर फिर कोशिश करें।";
      }
    });

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;

      mic.addEventListener("click", () => {
        status.textContent = "बोलिए, आपकी आवाज़ सुनी जा रही है...";
        recognition.start();
      });

      recognition.onresult = (event) => {
        input.value = event.results[0][0].transcript;
        form.requestSubmit();
      };

      recognition.onerror = () => {
        status.textContent =
          "आवाज़ से खोज उपलब्ध नहीं हुई। आप लिखकर खोज सकते हैं।";
      };

      recognition.onend = () => {
        if (status.textContent.includes("आवाज़ सुनी")) {
          status.textContent = "आप चाहें तो लिखकर भी खोज सकते हैं।";
        }
      };
    } else {
      mic.addEventListener("click", () => {
        status.textContent =
          "इस ब्राउज़र में माइक्रोफोन खोज उपलब्ध नहीं है। लिखकर खोजें।";
      });
    }
  </script>
</body>
</html>
