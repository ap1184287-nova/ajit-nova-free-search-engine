
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05091b">
  <meta name="description" content="AJIT NOVA — Explore Beyond">
  <title>AJIT NOVA — Explore Beyond</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon192.png" type="image/png">

  <style>
    :root {
      --bg: #05091b;
      --blue: #168cff;
      --cyan: #36d9ff;
      --text: #f5f8ff;
      --muted: #a7b7d4;
      --panel: rgba(14, 27, 57, 0.82);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      color: var(--text);
      font-family: system-ui, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 50% 22%, #102e68 0%, transparent 46%),
        radial-gradient(ellipse at 80% 80%, #151044 0%, transparent 45%),
        linear-gradient(145deg, #05091b, #080d21 60%, #100a2a);
    }

    header {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .mini-brand {
      color: var(--cyan);
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 2px;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .install-btn {
      display: none;
      padding: 9px 13px;
      color: white;
      background: #102b50;
      border: 1px solid #36d9ff80;
      border-radius: 12px;
      font-weight: 700;
    }

    main {
      width: 100%;
      max-width: 650px;
      margin: auto 0;
      padding: 42px 0 55px;
      text-align: center;
    }

    /* YOUR AJIT NOVA LOGO */
    .nova-logo {
      display: block;
      width: min(88%, 360px);
      height: auto;
      margin: 0 auto 18px;
      object-fit: contain;
      transform-origin: center;
      animation: novaFloat 3.2s ease-in-out infinite;
      filter:
        drop-shadow(0 0 8px #168cff)
        drop-shadow(0 0 18px #168cff);
      will-change: transform, filter;
    }

    @keyframes novaFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
        filter:
          drop-shadow(0 0 8px #168cff)
          drop-shadow(0 0 15px #168cff);
      }

      25% {
        transform: translateY(-8px) rotate(-1.5deg);
        filter:
          drop-shadow(0 0 12px #36d9ff)
          drop-shadow(0 0 25px #168cff);
      }

      50% {
        transform: translateY(0) rotate(0deg);
        filter:
          drop-shadow(0 0 9px #168cff)
          drop-shadow(0 0 19px #36d9ff);
      }

      75% {
        transform: translateY(-5px) rotate(1.5deg);
        filter:
          drop-shadow(0 0 13px #36d9ff)
          drop-shadow(0 0 25px #168cff);
      }
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 3px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid #36d9ff75;
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 0 25px #168cff20;
      backdrop-filter: blur(14px);
      transition: border-color .2s, box-shadow .2s;
    }

    .search-box:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 28px #168cff50;
    }

    #query {
      flex: 1;
      width: 100%;
      min-width: 0;
      padding: 13px 8px;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      font-size: 16px;
    }

    #query::placeholder {
      color: #a7b7d4;
    }

    .mic-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--cyan);
      background: #112749;
      border: 1px solid #36d9ff45;
      border-radius: 13px;
      font-size: 20px;
    }

    .search-btn {
      flex-shrink: 0;
      min-height: 42px;
      padding: 0 15px;
      color: white;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #168cff, #174ee8);
      box-shadow: 0 0 14px #168cff40;
      font-weight: 800;
    }

    .mic-btn:active,
    .search-btn:active,
    .install-btn:active {
      transform: scale(.96);
    }

    #status {
      min-height: 20px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .features {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 24px;
    }

    .feature {
      padding: 9px 12px;
      color: #dbeaff;
      background: #10203b99;
      border: 1px solid #36d9ff30;
      border-radius: 12px;
      font-size: 12px;
    }

    footer {
      width: 100%;
      max-width: 650px;
      padding: 16px 0 6px;
      color: #8194b7;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 380px) {
      body {
        padding: 13px;
      }

      .search-box {
        gap: 5px;
        padding: 6px;
      }

      #query {
        font-size: 14px;
        padding: 11px 5px;
      }

      .mic-btn {
        width: 36px;
        height: 39px;
      }

      .search-btn {
        padding: 0 10px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nova-logo {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="mini-brand">AN / NOVA</div>
    <button class="install-btn" id="installBtn" type="button">
      Install App
    </button>
  </header>

  <main>
    <img
      src="./nova-logo.png"
      alt="AJIT NOVA Logo"
      class="nova-logo"
      width="512"
      height="512"
      fetchpriority="high"
    >

    <p class="subtitle">EXPLORE BEYOND</p>

    <form class="search-box" id="searchForm">
      <input
        id="query"
        type="search"
        placeholder="AJIT NOVA पर कुछ भी खोजें…"
        aria-label="वेब पर कुछ भी खोजें"
        autocomplete="off"
        required
      >

      <button
        class="mic-btn"
        id="micBtn"
        type="button"
        aria-label="Voice Search"
        title="Voice Search"
      >🎙</button>

      <button class="search-btn" type="submit">खोजें ↗</button>
    </form>

    <p id="status" aria-live="polite">
      दुनिया की जानकारी खोजें — एक ही जगह
    </p>

    <div class="features">
      <div class="feature">✦ Global Search</div>
      <div class="feature">🎙 Voice Search</div>
      <div class="feature">⚡ Mobile Friendly</div>
    </div>
  </main>

  <footer>
    AJIT NOVA · Explore Beyond
  </footer>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const micBtn = document.getElementById("micBtn");
    const statusText = document.getElementById("status");
    const installBtn = document.getElementById("installBtn");

    // GOOGLE WEB SEARCH
    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) {
        input.focus();
        return;
      }

      window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);
    });

    // VOICE SEARCH
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micBtn.addEventListener("click", function () {
        statusText.textContent = "सुन रहा हूँ… बोलिए!";

        try {
          recognition.start();
        } catch (error) {
          statusText.textContent =
            "माइक पहले से चालू है। थोड़ी देर बाद कोशिश करें।";
        }
      });

      recognition.onresult = function (event) {
        input.value = event.results[0][0].transcript;
        statusText.textContent = "आवाज़ दर्ज हो गई। खोज रहे हैं…";
        form.requestSubmit();
      };

      recognition.onerror = function () {
        statusText.textContent =
          "माइक की अनुमति दें या खुद टाइप करके खोजें।";
      };

      recognition.onend = function () {
        if (statusText.textContent === "सुन रहा हूँ… बोलिए!") {
          statusText.textContent =
            "दुनिया की जानकारी खोजें — एक ही जगह";
        }
      };
    } else {
      micBtn.addEventListener("click", function () {
        statusText.textContent =
          "इस ब्राउज़र में Voice Search उपलब्ध नहीं है।";
      });
    }

    // PWA INSTALL
    let deferredPrompt = null;

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async function () {
      if (!deferredPrompt) {
        statusText.textContent =
          "ब्राउज़र मेन्यू से Add to Home screen चुनें।";
        return;
      }

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    window.addEventListener("appinstalled", function () {
      installBtn.style.display = "none";
      statusText.textContent = "AJIT NOVA इंस्टॉल हो गया!";
    });

    // KEEP THE EXISTING SERVICE WORKER
    if ("serviceWorker" in navigator &&
        location.protocol === "https:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(function (error) {
            console.log("Service worker registration failed.", error);
          });
      });
    }
  </script>
</body>
</html>
