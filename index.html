
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b19">
  <meta name="description" content="AJIT NOVA - Your personal search experience.">
  <title>AJIT NOVA — Explore Beyond</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    :root {
      --bg: #070b19;
      --blue: #168cff;
      --cyan: #36d9ff;
      --text: #f5f8ff;
      --muted: #a7b7d4;
      --panel: rgba(16, 29, 57, 0.78);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at 50% 38%,
          rgba(0, 113, 255, 0.20), transparent 38%),
        radial-gradient(ellipse at 50% 100%,
          rgba(0, 200, 255, 0.12), transparent 45%),
        linear-gradient(145deg, #030611, #0b1530 55%, #050916);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .45;
      background-image:
        radial-gradient(2px 2px at 12% 18%, #d5f4ff 50%, transparent 60%),
        radial-gradient(1px 1px at 80% 22%, #fff 50%, transparent 60%),
        radial-gradient(2px 2px at 70% 70%, #68cfff 50%, transparent 60%),
        radial-gradient(1px 1px at 25% 75%, #fff 50%, transparent 60%),
        radial-gradient(1px 1px at 92% 48%, #fff 50%, transparent 60%),
        radial-gradient(2px 2px at 40% 12%, #75dfff 50%, transparent 60%);
      z-index: -1;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 18px 20px;
    }

    header {
      width: 100%;
      max-width: 1050px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      color: white;
      text-shadow: 0 0 18px rgba(54, 217, 255, .55);
    }

    .brand span {
      color: var(--cyan);
    }

    .status {
      font-size: 11px;
      color: #8ce9ff;
      border: 1px solid rgba(54, 217, 255, .32);
      border-radius: 30px;
      padding: 8px 12px;
      background: rgba(0, 132, 255, .08);
      white-space: nowrap;
    }

    main {
      width: 100%;
      max-width: 780px;
      margin: auto 0;
      padding: 55px 0 65px;
      text-align: center;
    }

    .globe {
      width: 138px;
      height: 138px;
      border-radius: 50%;
      margin: 0 auto 25px;
      position: relative;
      background:
        radial-gradient(circle at 32% 26%,
          #b4f7ff 0%, #43d9ff 9%, #0874e9 32%,
          #08265e 63%, #030b21 78%);
      box-shadow:
        0 0 25px rgba(0, 151, 255, .55),
        0 0 70px rgba(0, 111, 255, .28),
        inset -15px -15px 28px rgba(0, 0, 20, .75);
      border: 1px solid rgba(110, 222, 255, .7);
    }

    .globe::before {
      content: "";
      position: absolute;
      inset: 15px -7px;
      border: 1px solid rgba(98, 224, 255, .75);
      border-radius: 50%;
      transform: rotate(-25deg);
    }

    .globe::after {
      content: "";
      position: absolute;
      inset: -7px 15px;
      border: 1px solid rgba(98, 224, 255, .45);
      border-radius: 50%;
      transform: rotate(28deg);
    }

    h1 {
      font-size: clamp(36px, 8vw, 68px);
      margin: 0;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.12;
      text-shadow: 0 0 25px rgba(0, 132, 255, .3);
    }

    h1 span {
      color: var(--cyan);
      text-shadow: 0 0 22px rgba(54, 217, 255, .35);
    }

    .tagline {
      color: var(--muted);
      font-size: 15px;
      margin: 16px 0 32px;
      letter-spacing: .5px;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 8px;
      border: 1px solid rgba(75, 170, 255, .65);
      border-radius: 20px;
      background: var(--panel);
      box-shadow:
        0 0 25px rgba(0, 119, 255, .16),
        inset 0 0 15px rgba(0, 119, 255, .06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .search-form:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 28px rgba(0, 170, 255, .25);
    }

    #query {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      padding: 14px 9px;
      font-size: 15px;
    }

    #query::placeholder {
      color: #a9c2e8;
      opacity: 1;
    }

    .tool-button {
      flex-shrink: 0;
      border: 0;
      cursor: pointer;
      color: white;
      background: rgba(32, 110, 205, .2);
      border-radius: 13px;
      width: 44px;
      height: 44px;
      font-size: 20px;
      transition: .2s;
    }

    .tool-button:hover {
      background: rgba(31, 145, 255, .38);
    }

    .search-button {
      flex-shrink: 0;
      border: 0;
      cursor: pointer;
      padding: 0 19px;
      height: 46px;
      border-radius: 13px;
      color: white;
      font-weight: 800;
      font-size: 14px;
      background: linear-gradient(135deg, #087cff, #16c7ff);
      box-shadow: 0 0 18px rgba(0, 140, 255, .25);
    }

    .search-button:hover {
      filter: brightness(1.12);
    }

    #message {
      min-height: 20px;
      margin: 13px 0 0;
      font-size: 12px;
      color: #9ddfff;
    }

    .features {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .feature {
      color: #cce6ff;
      background: rgba(14, 38, 76, .58);
      border: 1px solid rgba(81, 153, 235, .28);
      border-radius: 30px;
      padding: 10px 14px;
      font-size: 12px;
    }

    .bottom-note {
      color: #8397b9;
      font-size: 12px;
      margin-top: 28px;
      line-height: 1.7;
    }

    footer {
      width: 100%;
      max-width: 1050px;
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid rgba(120, 164, 220, .14);
      color: #8193b3;
      font-size: 12px;
      line-height: 1.8;
    }

    footer strong {
      color: #b8eaff;
    }

    @media (max-width: 480px) {
      .page {
        padding: 20px 14px 16px;
      }

      .brand {
        font-size: 17px;
        letter-spacing: 1px;
      }

      .status {
        font-size: 10px;
        padding: 7px 9px;
      }

      main {
        padding: 45px 0;
      }

      .globe {
        width: 112px;
        height: 112px;
        margin-bottom: 24px;
      }

      .tagline {
        font-size: 13px;
        line-height: 1.6;
      }

      .search-form {
        gap: 4px;
        padding: 6px;
        border-radius: 16px;
      }

      #query {
        font-size: 12px;
        padding: 12px 4px;
      }

      .tool-button {
        width: 36px;
        height: 40px;
        font-size: 18px;
      }

      .search-button {
        height: 40px;
        padding: 0 11px;
        font-size: 12px;
      }

      .feature {
        padding: 9px 11px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="brand">AJIT <span>NOVA</span></div>
      <div class="status">✦ YOUR PERSONAL SEARCH</div>
    </header>

    <main>
      <div class="globe" aria-hidden="true"></div>

      <h1>AJIT <span>NOVA</span></h1>
      <p class="tagline">Explore Beyond · Discover More · Search Freely</p>

      <form class="search-form"
            id="searchForm"
            action="https://www.google.com/search"
            method="GET">

        <input
          id="query"
          type="search"
          name="q"
          placeholder="AJIT NOVA PER KUCHH BHI KHOJE..."
          aria-label="AJIT NOVA search"
          autocomplete="off"
          required
        >

        <button
          class="tool-button"
          type="button"
          id="micButton"
          aria-label="Voice search"
          title="Bolkar search karein">🎙️</button>

        <button class="search-button" type="submit">
          SEARCH ↗
        </button>
      </form>

      <p id="message" role="status"></p>

      <div class="features">
        <div class="feature">⚡ Quick Search</div>
        <div class="feature">🌐 Web Discovery</div>
        <div class="feature">📱 Mobile + PC</div>
        <div class="feature">✦ Installable Web App</div>
      </div>

      <div class="bottom-note">
        Your Search, Your Journey.<br>
        Search the web from one simple place.
      </div>
    </main>

    <footer>
      <strong>AJIT NOVA</strong><br>
      Made with ♥ by Ajit
    </footer>
  </div>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const micButton = document.getElementById("micButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
      if (!input.value.trim()) {
        event.preventDefault();
        message.textContent = "Pehle kuchh likho ya microphone se bolo.";
        input.focus();
      }
    });

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micButton.addEventListener("click", function () {
        message.textContent = "Bolna shuru karein...";
        recognition.start();
      });

      recognition.onresult = function (event) {
        input.value = event.results[0][0].transcript;
        message.textContent = "Aapki baat likh di gayi. Ab SEARCH dabayein.";
        input.focus();
      };

      recognition.onerror = function () {
        message.textContent =
          "Voice search nahi chala. Aap type karke search kar sakte hain.";
      };

      recognition.onend = function () {
        micButton.blur();
      };
    } else {
      micButton.addEventListener("click", function () {
        message.textContent =
          "Is browser mein voice search support nahi hai. Type karke search karein.";
      });
    }
  </script>
</body>
</html>
