
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1c">
<title>AJIT NOVA Search</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17356b,#080d1c 65%);color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:22px}
main{width:100%;max-width:650px;text-align:center}
.logo{font-size:clamp(38px,10vw,65px);font-weight:900;letter-spacing:2px;color:#65c8ff;text-shadow:0 0 25px #1677ff}
.tag{color:#b7c8e8;margin:12px 0 30px}
.search{display:flex;gap:8px;background:white;padding:7px;border-radius:18px;box-shadow:0 0 30px #287dff45}
input{min-width:0;flex:1;border:0;outline:0;padding:13px;font-size:16px;color:#111;background:transparent}
button{border:0;border-radius:12px;background:#1769ff;color:white;padding:0 18px;font-size:16px;font-weight:bold}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.links a{color:#d8e8ff;background:#ffffff12;border:1px solid #ffffff25;padding:11px 14px;border-radius:12px;text-decoration:none}
.note{font-size:13px;color:#a8b8d4;margin-top:28px;line-height:1.6}
</style>
</head>
<body>
<main>
<div class="logo">AJIT NOVA</div>
<p class="tag">आपकी दुनिया, आपकी खोज 🚀</p>
<form class="search" action="https://www.google.com/search" method="get">
<input name="q" type="search" placeholder="यहाँ कुछ भी खोजें..." required>
<button type="submit">खोजें</button>
</form>
<div class="links">
<a href="https://www.google.com/">Google</a>
<a href="https://www.youtube.com/">YouTube</a>
<a href="https://www.wikipedia.org/">Wikipedia</a>
<a href="https://www.google.com/maps">Maps</a>
<a href="https://news.google.com/">News</a>
</div>
<p class="note">AJIT NOVA — Free Web Search<br>अपनी खोज लिखें और वेब पर परिणाम पाएँ।</p>
</main>
</body>
</html>
