<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <meta name="description" content="AJIT NOVA GLOBAL - Search the world">
  <title>AJIT NOVA GLOBAL</title>

  <style>
    :root {
      --bg: #070b16;
      --panel: rgba(18, 27, 48, 0.88);
      --text: #f4f7ff;
      --muted: #9baac7;
      --blue: #39bfff;
      --border: rgba(140, 180, 255, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at top, #15305b 0%, transparent 55%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background 0.3s;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 19, 0.36);
      pointer-events: none;
      z-index: -1;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      max-width: 1000px;
      margin: auto;
      padding: 20px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span {
      color: var(--blue);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .small-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 65px 18px 110px;
      text-align: center;
    }

    .orb {
      width: 76px;
      height: 76px;
      border-radius: 25px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      font-size: 35px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #138aff, #744bff);
      box-shadow: 0 0 42px #258cff45;
      transform: rotate(-5deg);
    }

    h1 {
      font-size: clamp(34px, 8vw, 58px);
      margin: 0;
      letter-spacing: -2px;
    }

    h1 span {
      color: var(--blue);
    }

    .subtitle {
      color: var(--muted);
      margin: 15px 0 32px;
      font-size: 15px;
      line-height: 1.6;
    }

    .searchbox {
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: var(--panel);
      box-shadow: 0 15px 55px #0003;
      backdrop-filter: blur(15px);
    }

    .searchbox input {
      min-width: 0;
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 13px 10px;
      font-size: 16px;
    }

    .searchbox input::placeholder {
      color: var(--muted);
    }

    .search-btn {
      border: none;
      border-radius: 13px;
      padding: 0 20px;
      color: #04111e;
      background: linear-gradient(135deg, #64d8ff, #329cff);
      font-weight: bold;
    }

    .section-title {
      margin: 35px 0 15px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .shortcut {
      text-decoration: none;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 8px;
      backdrop-filter: blur(12px);
      transition: transform .2s, border-color .2s;
    }

    .shortcut:hover {
      transform: translateY(-3px);
      border-color: var(--blue);
    }

    .shortcut .emoji {
      display: block;
      font-size: 25px;
      margin-bottom: 9px;
    }

    .shortcut .label {
      font-size: 13px;
      font-weight: bold;
    }

    .hint {
      margin-top: 26px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 18px;
    }

    #photoInput {
      display: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 12px 18px;
      border-radius: 12px;
      background: #18243a;
      border: 1px solid var(--border);
      color: white;
      font-size: 13px;
      display: none;
      z-index: 20;
    }

    body.light {
      --bg: #edf4ff;
      --panel: rgba(255, 255, 255, 0.91);
      --text: #142039;
      --muted: #60708c;
      --border: rgba(60, 95, 150, 0.2);
    }

    body.light::before {
      background: rgba(255, 255, 255, 0.15);
    }

    .bottom-tools {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      width: calc(100% - 24px);
      max-width: 500px;
      z-index: 10;
    }

    @media (max-width: 420px) {
      main {
        padding-top: 48px;
      }

      .brand {
        font-size: 17px;
      }

      .small-btn {
        padding: 9px;
        font-size: 12px;
      }

      .searchbox {
        gap: 4px;
      }

      .search-btn {
        padding: 0 13px;
      }

      .shortcut {
        padding: 15px 5px;
      }
    }
  </style>
</head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b57d0">
<body>
  <header class="topbar">
    <div class="brand">AJIT <span>NOVA</span></div>

    <div class="top-actions">
      <button class="small-btn" id="themeBtn" type="button">
        ☀️ Theme
      </button>
    </div>
  </header>

  <main>
    <div class="orb">N</div>

    <h1>AJIT <span>NOVA</span></h1>
    <div class="subtitle">
      GLOBAL SEARCH ENGINE<br>
      Your world. Your search.
    </div>

    <form class="searchbox" id="searchForm">
      <input
        id="searchInput"
        type="search"
        placeholder="Search anything in the world..."
        aria-label="Search the web"
        autocomplete="off"
        required
      >
      <button class="search-btn" type="submit">Search ↗</button>
    </form>

    <div class="section-title">EXPLORE THE WEB</div>

    <div class="shortcuts">
      <a class="shortcut" href="https://www.google.com/" target="_blank" rel="noopener">
        <span class="emoji">🌐</span>
        <span class="label">Web</span>
      </a>

      <a class="shortcut" href="https://images.google.com/" target="_blank" rel="noopener">
        <span class="emoji">🖼️</span>
        <span class="label">Images</span>
      </a>

      <a class="shortcut" href="https://news.google.com/" target="_blank" rel="noopener">
        <span class="emoji">📰</span>
        <span class="label">News</span>
      </a>

      <a class="shortcut" href="https://maps.google.com/" target="_blank" rel="noopener">
        <span class="emoji">📍</span>
        <span class="label">Maps</span>
      </a>

      <a class="shortcut" href="https://scholar.google.com/" target="_blank" rel="noopener">
        <span class="emoji">🎓</span>
        <span class="label">Study</span>
      </a>

      <a class="shortcut" href="https://www.youtube.com/" target="_blank" rel="noopener">
        <span class="emoji">▶️</span>
        <span class="label">Videos</span>
      </a>
    </div>

    <div class="hint">
      Search the web. Discover something new.<br>
      Made with ❤️ by AJIT NOVA
    </div>
  </main>

  <div class="bottom-tools">
    <button class="small-btn" id="backgroundBtn" type="button">
      🖼️ My Background
    </button>
    <button class="small-btn" id="resetBtn" type="button">
      ↩️ Reset
    </button>
  </div>

  <input id="photoInput" type="file" accept="image/*">

  <div class="toast" id="toast" role="status"></div>

  <footer>AJIT NOVA GLOBAL · Personal Web Search</footer>

  <script>
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const photoInput = document.getElementById("photoInput");
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.style.display = "block";
      clearTimeout(window.novaToastTimer);
      window.novaToastTimer = setTimeout(() => {
        toast.style.display = "none";
      }, 2500);
    }

    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) {
        searchInput.focus();
        return;
      }
      window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(query),
        "_blank",
        "noopener"
      );
    });

    document.getElementById("backgroundBtn").addEventListener("click", function () {
      photoInput.click();
    });

    function applyBackground(dataUrl) {
      document.body.style.backgroundImage =
        'linear-gradient(rgba(4,8,19,.48), rgba(4,8,19,.48)), url("' +
        dataUrl + '")';
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      document.body.style.backgroundAttachment = "fixed";
    }

    try {
      const savedBackground = localStorage.getItem("ajitNovaBg");
      if (savedBackground) applyBackground(savedBackground);

      if (localStorage.getItem("ajitNovaLight") === "yes") {
        document.body.classList.add("light");
      }
    } catch (error) {}

    photoInput.addEventListener("change", function () {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showToast("Please choose an image.");
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        showToast("Choose a photo under 2 MB.");
        photoInput.value = "";
        return;
      }

      const reader = new FileReader();

      reader.onload = function () {
        try {
          localStorage.setItem("ajitNovaBg", reader.result);
          applyBackground(reader.result);
          showToast("Background saved on this device!");
        } catch (error) {
          showToast("Could not save. Try a smaller photo.");
        }
      };

      reader.onerror = function () {
        showToast("Could not read this photo.");
      };

      reader.readAsDataURL(file);
    });

    document.getElementById("resetBtn").addEventListener("click", function () {
      try {
        localStorage.removeItem("ajitNovaBg");
        document.body.style.backgroundImage = "";
        document.body.style.backgroundColor = "";
        localStorage.removeItem("ajitNovaLight");
        document.body.classList.remove("light");
        showToast("Background and theme reset.");
      } catch (error) {
        showToast("Could not reset settings.");
      }
    });

    document.getElementById("themeBtn").addEventListener("click", function () {
      document.body.classList.toggle("light");

      try {
        localStorage.setItem(
          "ajitNovaLight",
          document.body.classList.contains("light") ? "yes" : "no"
        );
      } catch (error) {}

      showToast(
        document.body.classList.contains("light")
          ? "Light theme enabled."
          : "Dark theme enabled."
      );
    });
  </script>
</body>
</html>
