
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d20">
  <title>AJIT NOVA — Offline</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      text-align: center;
      color: #f4f7ff;
      background: radial-gradient(circle at top, #18356d, #070b19 70%);
    }

    .card {
      max-width: 420px;
      padding: 32px 24px;
      border: 1px solid #4c78c9;
      border-radius: 24px;
      background: rgba(24, 39, 76, .7);
      box-shadow: 0 0 45px #287cff25;
    }

    .icon { font-size: 54px; }

    h1 {
      margin: 12px 0;
      color: #78bdff;
    }

    p { color: #c3d2ef; line-height: 1.7; }

    button {
      padding: 13px 22px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #278cff, #8059ef);
      color: white;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🌌</div>
    <h1>AJIT NOVA</h1>
    <p>भाई, अभी इंटरनेट कनेक्शन उपलब्ध नहीं है।</p>
    <p>तुम्हारा NOVA दोबारा चलाने के लिए इंटरनेट चालू करो और फिर कोशिश करो।</p>
    <button onclick="location.reload()">फिर से कोशिश करें ↻</button>
  </main>
</body>
</html>
